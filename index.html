      text-transform: uppercase;
      letter-spacing: -1px;
      margin: 0 0 28px;
    }

    .section-title em {
      color: var(--green);
      font-style: normal;
    }

    .section-heading {
      display: flex;

      justify-content: space-between;
      gap: 50px;
      margin-bottom: 48px;
