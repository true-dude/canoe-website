<section class="events section-space" id="events"><div class="container">
      <div class="section-label inverse"><span class="section-n">02 /</span> КАЛЕНДАРЬ СЕЗОНА</div>
      <div class="section-title-line"><div><h2 class="display-title">ВРЕМЯ<br><em>НА СТАРТ.</em></h2><p>Календарь соревнований по сезонам и дисциплинам. В карточках стартов — подробности, источники и протоколы.</p></div><span class="title-stamp">СТАРТЫ <b id="season-stamp">{{ seasons.0|default:"" }}</b><br>КАЗАНЬ · ТАТАРСТАН</span></div>
      <div class="events-panel"><div class="events-toolbar"><div class="tabs" role="tablist" aria-label="Фильтр соревнований"><button type="button" class="tab active" data-filter="all" role="tab" aria-selected="true">Все старты</button><button type="button" class="tab" data-filter="sprint" role="tab" aria-selected="false">Байдарки / каноэ</button><button type="button" class="tab" data-filter="dragon" role="tab" aria-selected="false">«Дракон»</button></div><label class="year-select">СЕЗОН <select id="event-year" aria-label="Выбрать сезон">{% for season in seasons %}<option value="{{ season }}"{% if forloop.first %} selected{% endif %}>{{ season }}</option>{% empty %}<option value="">—</option>{% endfor %}</select></label></div>
      <div class="events-list" id="events-list" aria-live="polite"></div>
      <div class="events-footer"><span>Протоколы доступны в карточках соревнований после публикации.</span><a href="https://minsport.tatarstan.ru/kalendarny_plan.htm?pub_id=4961886.htm" target="_blank" rel="noopener noreferrer">Календарь Минспорта РТ</a></div></div>
    </div></section>
